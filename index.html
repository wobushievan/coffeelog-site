<h1>☕️ 咖啡手记 CoffeeLog — 技术支持</h1>
<p>咖啡手记是一款纯本地的咖啡记录 App，用来记下你买过的咖啡豆和去过的咖啡店。</p>

<h2>常见问题</h2>
<div class="card">
  <p><strong>我的数据存在哪里？</strong><br>
  全部数据只保存在你的 iPhone 本地，App 不联网、无账号、无云同步。删除 App 会同时删除所有记录，请谨慎。</p>
</div>
<div class="card">
  <p><strong>怎么删除或编辑一条记录？</strong><br>
  列表页左滑删除、右滑编辑，或长按卡片弹出菜单。</p>
</div>
<div class="card">
  <p><strong>App 收集我的什么信息？</strong><br>
  什么都不收集。详见<a href="privacy.html">隐私政策</a>。</p>
</div>
